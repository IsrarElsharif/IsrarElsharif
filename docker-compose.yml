services:
  postgres:
    image: postgres:16-alpine
    container_name: masar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masar
      POSTGRES_PASSWORD: masar
      POSTGRES_DB: masar
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
